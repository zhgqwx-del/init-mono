name: Check scaffold and three-service feature
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Scaffold tests and release bundle
        run: |
          python3 -B -m unittest discover -s tests -v
          python3 -B scripts/package_skill.py --check
      - name: Prepare three repositories and confirm baseline
        run: |
          python3 -B examples/three-services/demo.py setup "$RUNNER_TEMP/mono-example"
          python3 -B examples/three-services/demo.py verify "$RUNNER_TEMP/mono-example" --stage baseline
      - name: New feature must fail before implementation
        run: |
          if python3 -B examples/three-services/demo.py verify "$RUNNER_TEMP/mono-example" --stage feature > "$RUNNER_TEMP/before-feature.log" 2>&1; then
            exit 1
          fi
          python3 - <<'PY'
          import os
          from pathlib import Path
          output = (Path(os.environ["RUNNER_TEMP"]) / "before-feature.log").read_text()
          if "AssertionError" not in output or "404" not in output:
              raise RuntimeError("Failure did not demonstrate the missing feature")
          PY
      - name: Implement and test real HTTP feature
        run: |
          python3 -B examples/three-services/demo.py apply "$RUNNER_TEMP/mono-example"
          python3 -B examples/three-services/demo.py verify "$RUNNER_TEMP/mono-example" --stage feature
      - name: Prepare browser
        run: |
          npm install --prefix examples/three-services
          npx --prefix examples/three-services playwright install --with-deps chromium
      - name: Browser acceptance and joint evidence
        run: |
          python3 -B examples/three-services/demo.py browser "$RUNNER_TEMP/mono-example"
          python3 -B examples/three-services/demo.py check "$RUNNER_TEMP/mono-example"
