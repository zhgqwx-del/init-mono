<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>活动列表 · 运营后台</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand"><span class="brand-mark" aria-hidden="true"></span>运营后台</div>
      <div class="tenant">演示租户 A</div>
    </div>
  </header>
  <main class="workspace">
    <h1>活动列表</h1>
    <section class="panel" aria-label="活动查询与结果">
      <form id="filters" class="filters" role="search" aria-label="筛选活动">
        <label for="keyword">关键词
          <input id="keyword" name="keyword" type="search" placeholder="输入活动名称">
        </label>
        <label for="status">活动状态
          <select id="status" name="status">
            <option value="">全部</option>
            <option value="DRAFT">草稿</option>
            <option value="ACTIVE">进行中</option>
            <option value="ENDED">已结束</option>
          </select>
        </label>
        <button class="primary" type="submit">查询</button>
      </form>
      <div class="results-title">
        <h2>查询结果</h2>
        <span id="summary" aria-live="polite"></span>
      </div>
      <div class="table-wrap">
        <table aria-label="活动">
          <thead><tr><th scope="col">活动 ID</th><th scope="col">活动名称</th><th scope="col">活动状态</th></tr></thead>
          <tbody id="results"></tbody>
        </table>
      </div>
      <div id="message" class="message" hidden></div>
      <div class="pagination" aria-label="分页">
        <label class="page-size" for="page-size">每页条数
          <select id="page-size"><option value="20">20</option><option value="1">1</option></select>
        </label>
        <div class="page-buttons">
          <button id="previous" type="button" disabled>上一页</button>
          <span id="position" aria-live="polite">第 1 / 1 页</span>
          <button id="next" type="button" disabled>下一页</button>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
